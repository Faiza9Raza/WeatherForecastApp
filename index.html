<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        xintegrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-app">
        <!-- Header: Title and Search -->
        <header>
            <h1>Weather Dashboard</h1>
            <div class="search-container">
                <input type="text" id="city-input" placeholder="Enter city name...">
                <button id="search-btn" aria-label="Search"><i class="fas fa-search"></i></button>
                <button id="location-btn" aria-label="Use current location"><i
                        class="fas fa-map-marker-alt"></i></button>
            </div>
        </header>

        <!-- Main content area for weather info -->
        <div id="weather-content">
            <main>
                <!-- Current Weather Details -->
                <div class="current-weather">
                    <div class="location-details">
                        <h2 class="city" id="city-name">--</h2>
                        <p class="date" id="current-date">--</p>
                    </div>
                    <div class="weather-details">
                        <p class="temp" id="current-temp">--°C</p>
                        <div>
                            <img src="https://openweathermap.org/img/wn/10d@2x.png" alt="Weather Icon"
                                class="weather-icon" id="current-weather-icon">
                            <p class="description" id="weather-description">--</p>
                        </div>
                    </div>
                </div>

                <!-- Extra Details: Humidity, Wind, etc. -->
                <div class="extra-details">
                    <div class="detail-item">
                        <i class="fas fa-tint"></i>
                        <div>
                            <p class="value" id="humidity">--%</p>
                            <p class="label">Humidity</p>
                        </div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-wind"></i>
                        <div>
                            <p class="value" id="wind-speed">-- km/h</p>
                            <p class="label">Wind Speed</p>
                        </div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-eye"></i>
                        <div>
                            <p class="value" id="visibility">-- km</p>
                            <p class="label">Visibility</p>
                        </div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-temperature-high"></i>
                        <div>
                            <p class="value" id="feels-like">--°C</p>
                            <p class="label">Feels Like</p>
                        </div>
                    </div>
                </div>
            </main>

            <!-- 5-Day Forecast -->
            <div class="forecast">
                <h2>5-Day Forecast</h2>
                <div class="forecast-container" id="forecast-container">
                    <!-- Forecast cards will be injected here by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Loader and Error Message -->
        <div id="loader-container" class="loader-container hidden">
            <div class="loader"></div>
        </div>
        <div id="error-message" class="hidden">
            <p>Could not find weather data for the specified location. Please try again.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
